name: Build GeoLifeRP APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP="$(ls *.zip 2>/dev/null | head -1 || true)"
          if [ -n "$ZIP" ]; then unzip -q -o "$ZIP"; fi
          GR="$(find . -name gradlew -not -path './.git/*' | head -1)"
          echo "gradlew: $GR"
          echo "PROJ=$(cd "$(dirname "$GR")" && pwd)" >> "$GITHUB_ENV"

      - name: Fix file name case (Windows to Linux)
        run: |
          C="$PROJ/app/src/main/cpp/samp"
          grep -rliE '"rgba\.h"' "$C" --include=*.h --include=*.cpp --include=*.c | xargs -r sed -i -E 's/"rgba\.h"/"rgba.h"/I'
          grep -rliE 'samp_widgets/playertablist\.h' "$C" --include=*.h --include=*.cpp | xargs -r sed -i -E 's#samp_widgets/playertablist\.h#samp_widgets/playertablist.h#I'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build Debug APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1 || {
            echo "=========== ERRORS ==========="
            grep -E "error:|fatal error|undefined reference|undefined symbol|What went wrong" -A2 "$GITHUB_WORKSPACE/build.log" | sed 's#.*/app/src/main/cpp/##' | head -60
            echo "=========== END ==========="
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoLifeRP-client-apk
          path: "**/build/outputs/apk/debug/*.apk"
