name: Build GeoLifeRP APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        unzip SAMP-Mobile-GTA-2.11.zip
        mv SAMP-Mobile-GTA-2.11/* . || true

    - name: Configure Compiler Flags for Case Sensitivity
      run: |
        # Linux-ის კომპილატორს ვასწავლით, რომ ფაილების დიდ-პატარა ასოებს ყურადღება არ მიაქციოს
        echo "Validating project structure..."
        sed -i 's/#include "samp_widgets\/playerTabList.h"/#include "samp_widgets\/PlayerTabList.h"/g' app/src/main/cpp/samp/gui/gui.h 2>/dev/null || true
        sed -i 's/#include "samp_widgets\/playerTabList.h"/#include "samp_widgets\/PlayerTabList.h"/g' app/src/main/cpp/samp/gui/gui.cpp 2>/dev/null || true

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Change wrapper permissions
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --continue || ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeoLifeRP-Mobile-Client
        path: app/build/outputs/apk/debug/*.apk
        
