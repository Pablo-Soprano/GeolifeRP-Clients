name: Build GeoLifeRP APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create Case-Insensitive Workspace
      run: |
        sudo dd if=/dev/zero of=workspace.img bs=1M count=4096
        sudo mkfs.vfat -F 32 workspace.img
        mkdir -p ci-workspace
        sudo mount -o loop,uid=$(id -u),gid=$(id -g) workspace.img ci-workspace
        cp -r ./* ci-workspace/ || true

    - name: Extract and Move Project
      run: |
        cd ci-workspace
        unzip SAMP-Mobile-GTA-2.11.zip
        mv SAMP-Mobile-GTA-2.11/* . || true

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Change wrapper permissions
      run: |
        cd ci-workspace
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd ci-workspace
        ./gradlew assembleDebug

    - name: Copy and Upload APK Artifact
      if: always()
      run: |
        mkdir -p output-apk
        cp ci-workspace/app/build/outputs/apk/debug/*.apk output-apk/ || true
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeoLifeRP-Mobile-Client
        path: output-apk/*.apk
        
