name: Build GeoLifeRP APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP="$(ls *.zip 2>/dev/null | head -1 || true)"
          if [ -n "$ZIP" ]; then unzip -q -o "$ZIP"; fi
          GR="$(find . -name gradlew -not -path './.git/*' | head -1)"
          echo "gradlew: $GR"
          echo "PROJ=$(cd "$(dirname "$GR")" && pwd)" >> "$GITHUB_ENV"

      - name: Fix include case and paths
        run: python3 "$GITHUB_WORKSPACE/fix_includes.py" "$PROJ/app/src/main/cpp"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build Debug APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoLifeRP-client-apk
          path: "**/build/outputs/apk/debug/*.apk"
