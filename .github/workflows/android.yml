name: Build GeoLifeRP APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP="$(ls *.zip 2>/dev/null | head -1 || true)"
          if [ -n "$ZIP" ]; then unzip -q -o "$ZIP"; fi
          GR="$(find . -name gradlew -not -path './.git/*' | head -1)"
          echo "gradlew: $GR"
          echo "PROJ=$(cd "$(dirname "$GR")" && pwd)" >> "$GITHUB_ENV"

      - name: Fix include case and paths
        run: python3 "$GITHUB_WORKSPACE/fix_includes.py" "$PROJ/app/src/main/cpp" | tee "$GITHUB_WORKSPACE/fix.log"

      - name: Fix CQuaternion
        run: |
          QH="$(grep -rlE '^(class|struct) CQuaternion\b[^;]*$' "$PROJ/app/src/main/cpp" --include=*.h --include=*.hpp | head -1)"
          echo "CQuaternion defined in: $QH"
          find "$PROJ/app/src/main/cpp" -name Matrix.h | while read F; do
            if [ -n "$QH" ]; then
              grep -q "AUTOFIX_QUAT" "$F" || sed -i "1i #include \"$QH\" // AUTOFIX_QUAT" "$F"
            else
              grep -q '^class CQuaternion;' "$F" || sed -i '1i class CQuaternion;' "$F"
            fi
          done

      - name: Create opus version.h
        run: |
          F="$(find "$PROJ/app/src/main/cpp" -path '*opus/celt/config.h' | head -1)"
          if [ -n "$F" ]; then
            D="$(dirname "$F")"
            if [ ! -e "$D/version.h" ]; then
              V="$(find "$PROJ" -name version.h -not -path '*/build/*' | head -1)"
              if [ -n "$V" ]; then cp "$V" "$D/version.h"; else printf '#ifndef PACKAGE_VERSION\n#define PACKAGE_VERSION "1.3.1"\n#endif\n' > "$D/version.h"; fi
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build Debug APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1 || {
            echo "=========== ERRORS ==========="
            grep -E "error:|fatal error|undefined reference|undefined symbol" "$GITHUB_WORKSPACE/build.log" | sed 's#.*/app/src/main/cpp/##' | sort -u | head -40
            echo "=========== MISSING INCLUDES ==========="
            grep MISSING "$GITHUB_WORKSPACE/fix.log" | head -30
            echo "=========== DIAG ==========="
            find "$PROJ" -name Matrix.h -not -path '*/build/*' | sed 's#.*/app/src/main/cpp/##'
            find "$PROJ" -iname 'sigproc*' -not -path '*/build/*' | sed 's#.*/app/src/main/cpp/##' | head
            grep -rn "CQuaternion" "$PROJ/app/src/main/cpp" --include=*.h -l | sed 's#.*/app/src/main/cpp/##' | head -15
            echo "=========== END ==========="
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoLifeRP-client-apk
          path: "**/build/outputs/apk/debug/*.apk"
